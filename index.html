<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART TECHNOLOGIES TCHAD — Applications, réseaux, agriculture intelligente</title>
<meta name="description" content="SMART TECHNOLOGIES TCHAD conçoit, déploie et maintient des applications, des réseaux informatiques et des solutions d'agriculture intelligente pour les organisations tchadiennes.">
<meta name="theme-color" content="#0B0F0D">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/grotesk.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Archivo';src:url('fonts/archivo.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Grotesk';src:url('fonts/grotesk.woff2') format('woff2');font-weight:500;font-display:swap}

:root{
  --canvas:#0B0F0D; --surface:#121815; --surface-2:#17201C; --line:#22302A;
  --ink:#F3EFE7; --ink-soft:#B9C7C0; --ink-mute:#8FA39B;
  --accent:#1FB985; --accent-deep:#0E8C63;
  --display:'Archivo',system-ui,sans-serif; --text:'Grotesk',system-ui,sans-serif;
  --pad:clamp(20px,5vw,64px); --max:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--canvas);color:var(--ink);font-family:var(--text);font-size:16px;
  line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-mute)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.12;letter-spacing:-.01em}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(11,15,13,.82);border-bottom:1px solid transparent;transition:border-color .3s}
header.scrolled{border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:24px;height:72px}
.nav__logo img{height:26px;width:auto}
.nav__links{display:flex;gap:28px;align-items:center}
.nav__links a{font-size:13.5px;color:var(--ink-soft);transition:color .2s}
.nav__links a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:var(--ink-mute);font-family:var(--text);
  font-size:11px;letter-spacing:.1em;padding:6px 12px;cursor:pointer;transition:.2s}
.lang button.on{background:var(--accent);color:#04241A}
.burger{display:none;background:none;border:0;color:var(--ink);cursor:pointer;padding:8px}
@media(max-width:880px){
  .nav__links{display:none}
  .burger{display:block}
  .nav__links.open{display:flex;position:fixed;inset:72px 0 auto 0;flex-direction:column;
    background:var(--surface);padding:24px var(--pad);gap:18px;border-bottom:1px solid var(--line)}
}

/* ---------- hero ---------- */
.hero{position:relative;padding:170px 0 96px;overflow:hidden}
.hero::before{content:'';position:absolute;top:-30%;right:-10%;width:760px;height:760px;
  background:radial-gradient(circle,rgba(31,185,133,.13),transparent 62%);pointer-events:none}
.hero__rule{width:64px;height:3px;background:var(--accent);margin-bottom:28px}
.hero h1{font-size:clamp(38px,6.4vw,74px);max-width:16ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin-top:26px;max-width:56ch;color:var(--ink-soft);font-size:clamp(15px,1.6vw,18px)}
.hero__cta{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:99px;
  font-size:14px;letter-spacing:.02em;transition:transform .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-2px)}
.btn--solid{background:var(--accent);color:#04241A;font-weight:500}
.btn--ghost{border:1px solid var(--line);color:var(--ink-soft)}
.btn--ghost:hover{border-color:var(--accent);color:var(--ink)}
.band{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:72px}
.band div{background:var(--surface);padding:22px 20px}
.band b{display:block;font-family:var(--display);font-size:14px;letter-spacing:.04em}
.band span{font-size:11.5px;color:var(--ink-mute);display:block;margin-top:4px}
@media(max-width:760px){.band{grid-template-columns:repeat(2,1fr)}}

/* ---------- sections ---------- */
section{scroll-margin-top:96px}
.sec{padding:96px 0}
.sec__head{max-width:62ch;margin-bottom:54px}
.sec__head h2{font-size:clamp(28px,3.6vw,44px);margin-top:14px}
.sec__head p{color:var(--ink-soft);margin-top:16px}

/* about */
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px}
.chip{border:1px solid var(--line);border-radius:99px;padding:7px 15px;font-size:12.5px;color:var(--ink-soft)}
.about__side{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px}
.about__side h3{font-size:15px;margin-bottom:16px;letter-spacing:.02em}
.about__side li{list-style:none;display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);
  font-size:13.5px;color:var(--ink-soft)}
.about__side li:last-child{border:0}
.about__side svg{flex:0 0 16px;color:var(--accent);margin-top:3px}
@media(max-width:880px){.about{grid-template-columns:1fr;gap:32px}}

/* poles */
.pole{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;
  padding:44px 0;border-top:1px solid var(--line)}
.pole:last-child{border-bottom:1px solid var(--line)}
.pole--flip .pole__art{order:2}
.pole__num{font-family:var(--display);font-size:12px;color:var(--accent);letter-spacing:.14em}
.pole h3{font-size:clamp(22px,2.6vw,30px);margin:10px 0 14px}
.pole p{color:var(--ink-soft);font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pill{font-size:11.5px;letter-spacing:.05em;color:var(--accent);background:rgba(31,185,133,.08);
  border:1px solid rgba(31,185,133,.22);border-radius:99px;padding:5px 12px}
.pole__art{background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:36px;display:flex;align-items:center;justify-content:center;min-height:280px}
.pole__art svg{width:100%;max-width:230px;color:var(--accent);stroke-width:1.4}
@media(max-width:880px){
  .pole{grid-template-columns:1fr;gap:28px}
  .pole--flip .pole__art{order:0}
}

/* audiences */
.aud{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.aud article{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 22px;
  transition:border-color .25s,transform .25s}
.aud article:hover{border-color:rgba(31,185,133,.4);transform:translateY(-3px)}
.aud h3{font-size:15px;margin-bottom:8px}
.aud p{font-size:13px;color:var(--ink-mute);line-height:1.55}
@media(max-width:900px){.aud{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.aud{grid-template-columns:1fr}}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:stretch}
form{display:grid;gap:14px}
label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute)}
input,textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:13px 16px;color:var(--ink);font-family:var(--text);font-size:14px;
  transition:border-color .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:110px}
.field{display:grid;gap:7px}
.hint{font-size:12px;color:var(--ink-mute);margin-top:10px}
.info{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;
  display:flex;flex-direction:column;justify-content:center}
.info dl{display:grid;gap:20px}
.info dt{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-mute)}
.info dd{margin-top:5px;font-size:15px}
.info a{border-bottom:1px solid rgba(31,185,133,.4);transition:color .2s}
.info a:hover{color:var(--accent)}
@media(max-width:880px){.contact{grid-template-columns:1fr;gap:32px}}

/* faq */
.faq details{border-top:1px solid var(--line);padding:20px 0}
.faq details:last-of-type{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;font-size:16px;display:flex;justify-content:space-between;
  gap:20px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';color:var(--accent);font-size:20px;transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{color:var(--ink-soft);font-size:14.5px;margin-top:14px;max-width:70ch}

/* footer */
footer{border-top:1px solid var(--line);padding:56px 0 34px;margin-top:40px}
.foot{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px}
.foot h4{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:14px}
.foot a,.foot p{font-size:13.5px;color:var(--ink-soft);display:block;padding:4px 0}
.foot a:hover{color:var(--accent)}
.foot__brand img{height:30px;margin-bottom:16px}
.foot__brand p{max-width:34ch;font-size:13px;color:var(--ink-mute);line-height:1.6}
.legal{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-mute);
  letter-spacing:.04em}
@media(max-width:880px){.foot{grid-template-columns:1fr 1fr;gap:28px}}

/* reveal */
.rv{opacity:1;transform:none}
html.js .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
html.js .rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html.js .rv{opacity:1;transform:none;transition:none}}
</style>
</head>
